server.port=8080
server.forward-headers-strategy=framework
spring.application.name=sgdp

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sgdp_db}
spring.datasource.username=${DATABASE_USERNAME:sgdp_app}
spring.datasource.password=${DATABASE_PASSWORD:local_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:dev-secret-key-minimum-64-characters-long-for-local-development-only}
jwt.expiration.ms=28800000

r2.access-key=${R2_ACCESS_KEY:minioadmin}
r2.secret-key=${R2_SECRET_KEY:minioadmin}
r2.bucket-name=${R2_BUCKET_NAME:sgdp-documentos}
r2.endpoint=${R2_ENDPOINT:http://localhost:9000}

brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@sanraymundo.gob.gt}
brevo.sender-name=${BREVO_SENDER_NAME:Municipalidad de San Raymundo}

cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

logging.level.gt.gob.sanraymundo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.filter=WARN
