# Test profile — connects to local PostgreSQL spun up by CI (GitHub Actions service)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sgdp_test}
spring.datasource.username=${DB_USERNAME:sgdp}
spring.datasource.password=${DB_PASSWORD:testpassword}
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=${JWT_SECRET:test-secret-key-minimum-64-characters-long-for-hs256-algorithm-ok}
jwt.expiration.ms=3600000

r2.access-key=test
r2.secret-key=test
r2.bucket-name=test
r2.endpoint=http://localhost:9000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

brevo.api-key=test-key
brevo.sender-email=test@test.com

logging.level.root=WARN
logging.level.gt.gob.sanraymundo=INFO
